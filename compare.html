<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>XML 比對工具</title>
<style>
  :root{
    --bg:#0f1220;
    --bg-soft:#161a2c;
    --panel:#1c2136;
    --panel-2:#232a45;
    --border:#2e3552;
    --text:#e8eaf5;
    --text-dim:#9aa1c4;
    --accent:#6d8dff;
    --accent-2:#8f6dff;
    --green:#3ddc97;
    --red:#ff6b81;
    --amber:#ffb454;
    --radius:14px;
    --shadow:0 10px 30px rgba(0,0,0,0.35);
    font-family: -apple-system, "Segoe UI", "Noto Sans TC", "Microsoft JhengHei", sans-serif;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    min-height:100vh;
    background: radial-gradient(circle at 10% -10%, #2a2f55 0%, var(--bg) 45%) fixed;
    color:var(--text);
    padding:32px 24px 60px;
  }
  .wrap{max-width:1180px;margin:0 auto;}
  header{
    text-align:center;
    margin-bottom:28px;
  }
  header h1{
    font-size:28px;
    margin:0 0 8px;
    background:linear-gradient(90deg,var(--accent),var(--accent-2));
    -webkit-background-clip:text;
    background-clip:text;
    color:transparent;
    letter-spacing:1px;
  }
  header p{
    margin:0;
    color:var(--text-dim);
    font-size:14px;
  }
  .card{
    background:var(--panel);
    border:1px solid var(--border);
    border-radius:var(--radius);
    box-shadow:var(--shadow);
    padding:20px;
  }
  .input-grid{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:20px;
    margin-bottom:20px;
  }
  @media (max-width: 860px){
    .input-grid{grid-template-columns:1fr;}
  }
  .input-col h2{
    font-size:15px;
    margin:0 0 10px;
    display:flex;
    align-items:center;
    gap:8px;
  }
  .badge-a{background:var(--accent);color:#0b0d18;border-radius:6px;padding:2px 8px;font-size:12px;font-weight:700;}
  .badge-b{background:var(--accent-2);color:#0b0d18;border-radius:6px;padding:2px 8px;font-size:12px;font-weight:700;}
  textarea{
    width:100%;
    min-height:230px;
    resize:vertical;
    background:var(--bg-soft);
    color:var(--text);
    border:1px solid var(--border);
    border-radius:10px;
    padding:12px;
    font-family:"SFMono-Regular", Consolas, "Courier New", monospace;
    font-size:13px;
    line-height:1.5;
  }
  textarea:focus{outline:2px solid var(--accent);}
  .row-tools{
    display:flex;
    align-items:center;
    gap:10px;
    margin-top:10px;
    flex-wrap:wrap;
  }
  .file-btn{
    position:relative;
    display:inline-flex;
    align-items:center;
    gap:6px;
    background:var(--panel-2);
    border:1px solid var(--border);
    color:var(--text);
    padding:8px 14px;
    border-radius:8px;
    font-size:13px;
    cursor:pointer;
    transition:.15s;
  }
  .file-btn:hover{border-color:var(--accent);}
  .file-btn input[type=file]{
    position:absolute;
    inset:0;
    opacity:0;
    cursor:pointer;
  }
  .file-name{font-size:12px;color:var(--text-dim);}
  .ghost-btn{
    background:transparent;
    border:1px solid var(--border);
    color:var(--text-dim);
    padding:8px 14px;
    border-radius:8px;
    font-size:13px;
    cursor:pointer;
  }
  .ghost-btn:hover{color:var(--text);border-color:var(--red);}
  .actions{
    display:flex;
    justify-content:center;
    margin:26px 0;
  }
  #compareBtn{
    background:linear-gradient(90deg,var(--accent),var(--accent-2));
    color:#0b0d18;
    border:none;
    font-weight:700;
    font-size:16px;
    padding:14px 42px;
    border-radius:999px;
    cursor:pointer;
    box-shadow:0 8px 24px rgba(109,141,255,0.35);
    transition:transform .15s;
  }
  #compareBtn:hover{transform:translateY(-2px);}
  #compareBtn:active{transform:translateY(0);}
  #errorBox{
    background:rgba(255,107,129,0.12);
    border:1px solid var(--red);
    color:#ffd7dd;
    padding:14px 18px;
    border-radius:10px;
    margin-bottom:20px;
    font-size:14px;
    white-space:pre-wrap;
  }
  .hidden{display:none !important;}
  .summary-bar{
    display:flex;
    gap:14px;
    flex-wrap:wrap;
    margin-bottom:18px;
  }
  .stat{
    background:var(--panel-2);
    border:1px solid var(--border);
    border-radius:10px;
    padding:10px 18px;
    font-size:13px;
    color:var(--text-dim);
  }
  .stat b{color:var(--text);font-size:18px;display:block;}
  .tabs{
    display:flex;
    gap:8px;
    border-bottom:1px solid var(--border);
    margin-bottom:18px;
  }
  .tab-btn{
    background:transparent;
    border:none;
    color:var(--text-dim);
    font-size:15px;
    font-weight:600;
    padding:12px 18px;
    cursor:pointer;
    border-bottom:3px solid transparent;
    transition:.15s;
  }
  .tab-btn:hover{color:var(--text);}
  .tab-btn.active{
    color:var(--text);
    border-bottom-color:var(--accent);
  }
  .tab-btn .count-pill{
    display:inline-block;
    margin-left:6px;
    background:var(--panel-2);
    border-radius:999px;
    padding:1px 9px;
    font-size:12px;
  }
  .tab-content{display:none;}
  .tab-content.active{display:block;}
  table{
    width:100%;
    border-collapse:collapse;
    font-size:13.5px;
  }
  thead th{
    text-align:left;
    color:var(--text-dim);
    font-weight:600;
    padding:10px 12px;
    border-bottom:1px solid var(--border);
    position:sticky;
    top:0;
    background:var(--panel);
  }
  tbody td{
    padding:12px;
    border-bottom:1px solid var(--border);
    vertical-align:top;
  }
  tbody tr:hover{background:rgba(109,141,255,0.06);}
  .path-cell{
    color:var(--text-dim);
    font-family:Consolas, monospace;
    font-size:12px;
    max-width:260px;
    word-break:break-all;
  }
  .label-cell{font-weight:400;}
  .breadcrumb{
    font-weight:700;
    font-size:14px;
    line-height:1.45;
    color:var(--text);
    margin-bottom:6px;
  }
  .attr-tag{
    display:inline-block;
    margin-bottom:6px;
    font-size:11px;
    color:var(--text-dim);
    background:var(--bg-soft);
    border:1px solid var(--border);
    border-radius:6px;
    padding:1px 6px;
  }
  .search-chip{
    display:flex;
    align-items:center;
    gap:6px;
    flex-wrap:wrap;
  }
  .chip-text{
    font-family:Consolas, monospace;
    font-size:12px;
    color:var(--accent);
    background:var(--bg-soft);
    border:1px solid var(--border);
    border-radius:6px;
    padding:2px 8px;
  }
  .copy-btn{
    font-size:11px;
    padding:2px 9px;
    border-radius:6px;
    border:1px solid var(--border);
    background:var(--panel-2);
    color:var(--text-dim);
    cursor:pointer;
    transition:.15s;
  }
  .copy-btn:hover{color:var(--text);border-color:var(--accent);}
  .key-sub{
    margin-top:6px;
    font-size:11px;
    color:var(--text-dim);
    font-family:Consolas, monospace;
    word-break:break-all;
  }
  .value-cell{
    font-family:Consolas, monospace;
    font-size:13px;
    word-break:break-all;
  }
  .diff-old{background:rgba(255,107,129,0.28);color:#ffd7dd;text-decoration:line-through;border-radius:3px;padding:0 2px;}
  .diff-new{background:rgba(61,220,151,0.25);color:#c8ffe8;border-radius:3px;padding:0 2px;}
  .diff-missing{color:var(--text-dim);font-style:italic;}
  .status-pill{
    font-size:11.5px;
    font-weight:700;
    border-radius:999px;
    padding:3px 10px;
    display:inline-block;
    white-space:nowrap;
  }
  .status-changed{background:rgba(255,180,84,0.18);color:var(--amber);}
  .status-added{background:rgba(61,220,151,0.18);color:var(--green);}
  .status-removed{background:rgba(255,107,129,0.18);color:var(--red);}
  .empty-state{
    text-align:center;
    color:var(--text-dim);
    padding:50px 0;
    font-size:14px;
  }
  footer{
    text-align:center;
    color:var(--text-dim);
    font-size:12px;
    margin-top:40px;
  }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>XML 比對工具</h1>
    <p>貼上或上傳兩份 XML，自動分類「檔案路徑差異」與「一般設定值差異」，並還原每筆差異在設定樹中的位置（例：上層項目 --> 上層項目 --> 設定名稱），方便直接拿去 Intel ME FIT 等工具搜尋。全部在瀏覽器本機執行，不會上傳任何資料。</p>
  </header>

  <div class="card input-grid">
    <div class="input-col">
      <h2><span class="badge-a">A</span> 舊版 / 原始 XML</h2>
      <textarea id="xmlA" placeholder="請貼上第一份 XML 內容，或點擊下方「上傳 .xml 檔案」..."></textarea>
      <div class="row-tools">
        <label class="file-btn">📁 上傳 .xml 檔案
          <input type="file" id="fileA" accept=".xml,text/xml" />
        </label>
        <span class="file-name" id="fileNameA"></span>
        <button class="ghost-btn" id="clearA" type="button">清除</button>
      </div>
    </div>
    <div class="input-col">
      <h2><span class="badge-b">B</span> 新版 / 待比對 XML</h2>
      <textarea id="xmlB" placeholder="請貼上第二份 XML 內容，或點擊下方「上傳 .xml 檔案」..."></textarea>
      <div class="row-tools">
        <label class="file-btn">📁 上傳 .xml 檔案
          <input type="file" id="fileB" accept=".xml,text/xml" />
        </label>
        <span class="file-name" id="fileNameB"></span>
        <button class="ghost-btn" id="clearB" type="button">清除</button>
      </div>
    </div>
  </div>

  <div class="actions">
    <button id="compareBtn" type="button">開始比對 ➜</button>
  </div>

  <div id="errorBox" class="hidden"></div>

  <div id="resultSection" class="hidden">
    <div class="summary-bar">
      <div class="stat"><b id="statTotal">0</b>總差異筆數</div>
      <div class="stat"><b id="statPath">0</b>檔案路徑差異</div>
      <div class="stat"><b id="statGeneral">0</b>一般設定值差異</div>
      <div class="stat"><b id="statAdded">0</b>新增</div>
      <div class="stat"><b id="statRemoved">0</b>刪除</div>
      <div class="stat"><b id="statChanged">0</b>變更</div>
    </div>

    <div class="card">
      <div class="tabs">
        <button class="tab-btn active" data-tab="path">🗂 檔案路徑差異 <span class="count-pill" id="countPath">0</span></button>
        <button class="tab-btn" data-tab="general">⚙️ 一般設定值差異 <span class="count-pill" id="countGeneral">0</span></button>
      </div>

      <div class="tab-content active" id="tab-path">
        <div id="tableWrapPath"></div>
      </div>
      <div class="tab-content" id="tab-general">
        <div id="tableWrapGeneral"></div>
      </div>
    </div>
  </div>

  <footer>所有解析與比對均在您的瀏覽器本機完成，資料不會傳送到任何伺服器。</footer>
</div>

<script>
(function(){
  "use strict";

  // ---------- DOM refs ----------
  const xmlAEl = document.getElementById('xmlA');
  const xmlBEl = document.getElementById('xmlB');
  const fileA = document.getElementById('fileA');
  const fileB = document.getElementById('fileB');
  const fileNameA = document.getElementById('fileNameA');
  const fileNameB = document.getElementById('fileNameB');
  const clearA = document.getElementById('clearA');
  const clearB = document.getElementById('clearB');
  const compareBtn = document.getElementById('compareBtn');
  const errorBox = document.getElementById('errorBox');
  const resultSection = document.getElementById('resultSection');

  // ---------- File upload handling ----------
  function wireFileInput(inputEl, textareaEl, nameLabelEl){
    inputEl.addEventListener('change', function(e){
      const file = e.target.files && e.target.files[0];
      if(!file) return;
      nameLabelEl.textContent = file.name;
      const reader = new FileReader();
      reader.onload = function(ev){
        textareaEl.value = ev.target.result;
      };
      reader.onerror = function(){
        alert('讀取檔案失敗：' + file.name);
      };
      reader.readAsText(file, 'UTF-8');
    });
  }
  wireFileInput(fileA, xmlAEl, fileNameA);
  wireFileInput(fileB, xmlBEl, fileNameB);

  clearA.addEventListener('click', function(){ xmlAEl.value=''; fileA.value=''; fileNameA.textContent=''; });
  clearB.addEventListener('click', function(){ xmlBEl.value=''; fileB.value=''; fileNameB.textContent=''; });

  // ---------- Tabs ----------
  document.querySelectorAll('.tab-btn').forEach(function(btn){
    btn.addEventListener('click', function(){
      document.querySelectorAll('.tab-btn').forEach(b=>b.classList.remove('active'));
      document.querySelectorAll('.tab-content').forEach(c=>c.classList.remove('active'));
      btn.classList.add('active');
      document.getElementById('tab-' + btn.dataset.tab).classList.add('active');
    });
  });

  // ---------- Helpers ----------
  function escapeHtml(str){
    return String(str)
      .replace(/&/g,'&amp;')
      .replace(/</g,'&lt;')
      .replace(/>/g,'&gt;')
      .replace(/"/g,'&quot;')
      .replace(/'/g,'&#39;');
  }

  function parseXML(text, labelForError){
    const parser = new DOMParser();
    const doc = parser.parseFromString(text, 'application/xml');
    const perr = doc.getElementsByTagName('parsererror');
    if(perr && perr.length > 0){
      throw new Error(labelForError + ' 的 XML 格式有誤，無法解析。請檢查標籤是否完整、有無多餘符號。\n\n瀏覽器回報訊息：\n' + perr[0].textContent.trim());
    }
    if(!doc.documentElement){
      throw new Error(labelForError + ' 沒有內容，或不是有效的 XML。');
    }
    return doc;
  }

  // 判斷是否為「檔案路徑」型的值
  function isPathLike(value, attrName, tagName){
    if(value === null || value === undefined) return false;
    const v = String(value);
    if(v.trim() === '') return false;
    if(v.indexOf(':/') !== -1 || v.indexOf(':\\') !== -1) return true;           // C:/xxx, C:\xxx
    if(/^[A-Za-z]:[\\\/]/.test(v)) return true;                                    // C:\ or C:/
    if(/^(\.{1,2})?[\\\/][^\s]*[\\\/][^\s]*$/.test(v)) return true;               // /a/b/c or \a\b\c
    if(/\.(bin|exe|dll|so|dat|cfg|ini|zip|img|iso|sys|inf|cat|msi|bat|sh|apk|elf|hex|rom)$/i.test(v.trim())) return true; // 常見副檔名
    const an = String(attrName || '');
    const tn = String(tagName || '');
    if(/_path$/i.test(an) || /_path$/i.test(tn)) return true;                      // 標籤/屬性結尾為 _path
    if(/^path$/i.test(an) || /^path$/i.test(tn)) return true;
    return false;
  }

  // ---------- Build flattened, path-addressable records ----------
  // Each record: { path, tag, label, breadcrumb, keyValue, attributes: {attrName: value} }
  // `breadcrumb` reconstructs "上兩層 label --> 這一層 label" (e.g. Integrated Clock
  // Controller --> PCH Clock Output Configuration --> SRCCLKREQ5#) so a diff can be
  // located quickly inside a tree UI like Intel ME FIT. `keyValue` / `tag` are the
  // raw identifiers that are usually what you'd paste into that tool's search box.
  const BREADCRUMB_DEPTH = 3; // ancestor labels + itself

  function buildRecords(doc){
    const records = new Map(); // path -> record
    const idAttrCandidates = ['key','name','id','Key','Name','ID','Name_','code','Code'];

    function identify(el){
      const tag = el.tagName;
      let usedAttr = null, usedVal = null;
      for(const cand of idAttrCandidates){
        if(el.hasAttribute && el.hasAttribute(cand)){
          usedAttr = cand;
          usedVal = el.getAttribute(cand);
          break;
        }
      }
      return { tag, usedAttr, usedVal };
    }

    function collectAttributes(el){
      const attributes = {};
      for(let i=0;i<el.attributes.length;i++){
        const a = el.attributes[i];
        attributes[a.name] = a.value;
      }
      if(el.children.length === 0){
        const txt = (el.textContent || '').trim();
        if(txt !== ''){
          attributes['__text__'] = txt;
        }
      }
      return attributes;
    }

    // labelChain = array of ancestor labels (only from elements that had a `label`
    // attribute) accumulated on the way down — this is what the breadcrumb is built from.
    function recurse(el, parentPath, labelChain){
      const info = identify(el);
      let segment;
      if(info.usedAttr !== null){
        segment = info.tag + '[' + info.usedAttr + '="' + info.usedVal + '"]';
      } else {
        segment = info.tag;
      }
      const path = parentPath ? (parentPath + ' > ' + segment) : segment;

      const ownLabel = el.hasAttribute('label') ? el.getAttribute('label') : null;

      // gather attributes, skipping the identifying attribute itself (already
      // encoded in the path) so it doesn't show up as noisy diff row
      const rawAttributes = collectAttributes(el);
      const attributes = {};
      Object.keys(rawAttributes).forEach(function(name){
        if(info.usedAttr !== null && name === info.usedAttr) return;
        attributes[name] = rawAttributes[name];
      });

      const fallbackLabel = info.usedVal !== null ? info.usedVal : info.tag;
      const displayLabel = ownLabel !== null ? ownLabel : fallbackLabel;
      const breadcrumbArr = labelChain.concat([displayLabel]);
      const breadcrumb = breadcrumbArr.slice(-BREADCRUMB_DEPTH).join(' --> ');
      const keyValue = (info.usedAttr === 'key') ? info.usedVal : (el.hasAttribute('key') ? el.getAttribute('key') : null);

      if(Object.keys(attributes).length > 0){
        records.set(path, { path, tag: info.tag, label: displayLabel, breadcrumb, keyValue, attributes });
      }

      const childLabelChain = ownLabel !== null ? labelChain.concat([ownLabel]) : labelChain;

      // recurse into children, adding an index suffix per (parent, tag) group when
      // there is no id-like attribute to disambiguate same-tag siblings
      const tagCounters = new Map();
      for(let i=0;i<el.children.length;i++){
        const child = el.children[i];
        const childTag = child.tagName;
        let childUsedAttr = null;
        for(const cand of idAttrCandidates){
          if(child.hasAttribute(cand)){ childUsedAttr = cand; break; }
        }
        if(childUsedAttr === null){
          const idx = tagCounters.get(childTag) || 0;
          tagCounters.set(childTag, idx + 1);
          recurseWithIndex(child, path, idx, childLabelChain);
        } else {
          recurse(child, path, childLabelChain);
        }
      }
    }

    // variant of recurse that forces an index suffix when no id attribute is present
    function recurseWithIndex(el, parentPath, idx, labelChain){
      const tag = el.tagName;
      const segment = tag + '#' + idx;
      const path = parentPath ? (parentPath + ' > ' + segment) : segment;

      const ownLabel = el.hasAttribute('label') ? el.getAttribute('label') : null;
      const attributes = collectAttributes(el);

      const displayLabel = ownLabel !== null ? ownLabel : tag;
      const breadcrumbArr = labelChain.concat([displayLabel]);
      const breadcrumb = breadcrumbArr.slice(-BREADCRUMB_DEPTH).join(' --> ');
      const keyValue = el.hasAttribute('key') ? el.getAttribute('key') : null;

      if(Object.keys(attributes).length > 0){
        records.set(path, { path, tag, label: displayLabel, breadcrumb, keyValue, attributes });
      }

      const childLabelChain = ownLabel !== null ? labelChain.concat([ownLabel]) : labelChain;

      const tagCounters = new Map();
      for(let i=0;i<el.children.length;i++){
        const child = el.children[i];
        const childTag = child.tagName;
        let childUsedAttr = null;
        for(const cand of idAttrCandidates){
          if(child.hasAttribute(cand)){ childUsedAttr = cand; break; }
        }
        if(childUsedAttr === null){
          const cIdx = tagCounters.get(childTag) || 0;
          tagCounters.set(childTag, cIdx + 1);
          recurseWithIndex(child, path, cIdx, childLabelChain);
        } else {
          recurse(child, path, childLabelChain);
        }
      }
    }

    const root = doc.documentElement;
    recurse(root, '', []);
    return records;
  }

  // ---------- Diff two value strings, highlighting only the changed middle part ----------
  function diffHighlight(oldStr, newStr){
    const oldS = (oldStr === null || oldStr === undefined) ? '' : String(oldStr);
    const newS = (newStr === null || newStr === undefined) ? '' : String(newStr);
    const minLen = Math.min(oldS.length, newS.length);
    let start = 0;
    while(start < minLen && oldS[start] === newS[start]) start++;
    let endOld = oldS.length, endNew = newS.length;
    while(endOld > start && endNew > start && oldS[endOld-1] === newS[endNew-1]){
      endOld--; endNew--;
    }
    const prefix = oldS.slice(0, start);
    const oldMid = oldS.slice(start, endOld);
    const newMid = newS.slice(start, endNew);
    const oldSuffix = oldS.slice(endOld);
    const newSuffix = newS.slice(endNew);

    const oldHtml = escapeHtml(prefix) + (oldMid ? '<span class="diff-old">' + escapeHtml(oldMid) + '</span>' : '') + escapeHtml(oldSuffix);
    const newHtml = escapeHtml(prefix) + (newMid ? '<span class="diff-new">' + escapeHtml(newMid) + '</span>' : '') + escapeHtml(newSuffix);
    return { oldHtml, newHtml };
  }

  function attrDisplayName(name){
    if(name === '__text__') return '(文字內容)';
    return name;
  }

  // ---------- Main compare ----------
  function compare(){
    errorBox.classList.add('hidden');
    errorBox.textContent = '';
    resultSection.classList.add('hidden');

    const textA = xmlAEl.value.trim();
    const textB = xmlBEl.value.trim();

    if(!textA || !textB){
      showError('請在左右兩個欄位都貼上或上傳 XML 內容後再開始比對。');
      return;
    }

    let docA, docB;
    try{
      docA = parseXML(textA, 'A（舊版）');
      docB = parseXML(textB, 'B（新版）');
    }catch(err){
      showError(err.message);
      return;
    }

    let recordsA, recordsB;
    try{
      recordsA = buildRecords(docA);
      recordsB = buildRecords(docB);
    }catch(err){
      showError('解析 XML 結構時發生錯誤：' + err.message);
      return;
    }

    const allPaths = new Set([...recordsA.keys(), ...recordsB.keys()]);
    const pathDiffs = [];
    const generalDiffs = [];
    let addedCount = 0, removedCount = 0, changedCount = 0;

    allPaths.forEach(function(path){
      const recA = recordsA.get(path);
      const recB = recordsB.get(path);
      const attrsA = recA ? recA.attributes : {};
      const attrsB = recB ? recB.attributes : {};
      const tag = (recB && recB.tag) || (recA && recA.tag) || '';
      const label = (recB && recB.label) || (recA && recA.label) || tag;
      const breadcrumb = (recB && recB.breadcrumb) || (recA && recA.breadcrumb) || label;
      const keyValue = (recB && recB.keyValue) || (recA && recA.keyValue) || null;

      const attrNames = new Set([...Object.keys(attrsA), ...Object.keys(attrsB)]);
      attrNames.forEach(function(attrName){
        const hasA = Object.prototype.hasOwnProperty.call(attrsA, attrName);
        const hasB = Object.prototype.hasOwnProperty.call(attrsB, attrName);
        const valA = hasA ? attrsA[attrName] : undefined;
        const valB = hasB ? attrsB[attrName] : undefined;

        if(valA === valB) return; // no diff

        let status;
        if(!hasA && hasB) status = 'added';
        else if(hasA && !hasB) status = 'removed';
        else status = 'changed';

        if(status === 'added') addedCount++;
        else if(status === 'removed') removedCount++;
        else changedCount++;

        const compareValue = (valB !== undefined) ? valB : valA;
        const pathLike = isPathLike(compareValue, attrName, tag) ||
                          isPathLike(valA, attrName, tag) ||
                          isPathLike(valB, attrName, tag);

        const entry = { path, tag, label, breadcrumb, keyValue, attrName, valA, valB, status };
        if(pathLike) pathDiffs.push(entry);
        else generalDiffs.push(entry);
      });
    });

    renderTable('tableWrapPath', pathDiffs, '沒有發現任何檔案路徑差異 🎉');
    renderTable('tableWrapGeneral', generalDiffs, '沒有發現任何一般設定值差異 🎉');

    document.getElementById('countPath').textContent = pathDiffs.length;
    document.getElementById('countGeneral').textContent = generalDiffs.length;
    document.getElementById('statTotal').textContent = pathDiffs.length + generalDiffs.length;
    document.getElementById('statPath').textContent = pathDiffs.length;
    document.getElementById('statGeneral').textContent = generalDiffs.length;
    document.getElementById('statAdded').textContent = addedCount;
    document.getElementById('statRemoved').textContent = removedCount;
    document.getElementById('statChanged').textContent = changedCount;

    resultSection.classList.remove('hidden');
    resultSection.scrollIntoView({ behavior: 'smooth', block: 'start' });
  }

  function statusPill(status){
    if(status === 'added') return '<span class="status-pill status-added">新增</span>';
    if(status === 'removed') return '<span class="status-pill status-removed">刪除</span>';
    return '<span class="status-pill status-changed">變更</span>';
  }

  function renderTable(containerId, diffs, emptyMessage){
    const container = document.getElementById(containerId);
    if(diffs.length === 0){
      container.innerHTML = '<div class="empty-state">' + escapeHtml(emptyMessage) + '</div>';
      return;
    }
    let html = '<table><thead><tr>' +
      '<th style="width:38%">設定位置（可貼到 ME FIT 搜尋框）</th>' +
      '<th style="width:9%">狀態</th>' +
      '<th style="width:26.5%">舊值 (A)</th>' +
      '<th style="width:26.5%">新值 (B)</th>' +
      '</tr></thead><tbody>';

    diffs.forEach(function(d){
      const diff = diffHighlight(d.valA, d.valB);
      const oldCell = (d.valA === undefined)
        ? '<span class="diff-missing">（此節點/屬性不存在）</span>'
        : diff.oldHtml;
      const newCell = (d.valB === undefined)
        ? '<span class="diff-missing">（此節點/屬性不存在）</span>'
        : diff.newHtml;

      const searchTerm = d.tag || d.label;
      const keyLine = d.keyValue
        ? '<div class="key-sub" title="' + escapeHtml(d.keyValue) + '">key: ' + escapeHtml(d.keyValue) + '</div>'
        : '';

      html += '<tr>' +
        '<td class="label-cell">' +
          '<div class="breadcrumb" title="完整技術路徑：' + escapeHtml(d.path) + '">' + escapeHtml(d.breadcrumb) + '</div>' +
          '<div class="attr-tag">變更欄位：' + escapeHtml(attrDisplayName(d.attrName)) + '</div>' +
          '<div class="search-chip">' +
            '<span class="chip-text">🔎 ' + escapeHtml(searchTerm) + '</span>' +
            '<button class="copy-btn" type="button" data-copy="' + escapeHtml(searchTerm) + '">複製</button>' +
          '</div>' +
          keyLine +
        '</td>' +
        '<td>' + statusPill(d.status) + '</td>' +
        '<td class="value-cell">' + oldCell + '</td>' +
        '<td class="value-cell">' + newCell + '</td>' +
        '</tr>';
    });

    html += '</tbody></table>';
    container.innerHTML = html;
  }

  // ---------- Copy-to-clipboard for the search chip (event delegation, works even
  // if the table is re-rendered) ----------
  document.addEventListener('click', function(e){
    const btn = e.target.closest('.copy-btn');
    if(!btn) return;
    const text = btn.dataset.copy || '';
    copyText(text, btn);
  });

  function copyText(text, btn){
    function flash(){
      const old = btn.textContent;
      btn.textContent = '已複製!';
      btn.disabled = true;
      setTimeout(function(){ btn.textContent = old; btn.disabled = false; }, 1200);
    }
    if(navigator.clipboard && navigator.clipboard.writeText){
      navigator.clipboard.writeText(text).then(flash).catch(function(){ fallbackCopy(text, flash); });
    } else {
      fallbackCopy(text, flash);
    }
  }

  function fallbackCopy(text, onDone){
    const ta = document.createElement('textarea');
    ta.value = text;
    ta.style.position = 'fixed';
    ta.style.left = '-9999px';
    document.body.appendChild(ta);
    ta.focus();
    ta.select();
    try{ document.execCommand('copy'); onDone(); }catch(e){ /* ignore */ }
    document.body.removeChild(ta);
  }

  function showError(msg){
    errorBox.textContent = msg;
    errorBox.classList.remove('hidden');
  }

  compareBtn.addEventListener('click', compare);
})();
</script>
</body>
